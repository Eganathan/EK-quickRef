{{ define "main" }}
<a href="{{ "/" | relURL }}" class="back-link">← All references</a>
<article>
  <header class="article-header panel"><p class="eyebrow">{{ .Section | title }} / Reference</p><h1>{{ .Title }}</h1><p class="description">{{ .Description }}</p><div class="tag-list">{{ range .Params.tags }}<a class="tag" href="{{ (printf "/tags/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}</div></header>
  <div class="article-layout"><div class="article-body panel prose">{{ .Content }}</div>{{ if gt (len .Fragments.Headings) 0 }}<details class="toc" open><summary>On this page</summary>{{ .TableOfContents }}</details>{{ end }}</div>
</article>
{{ end }}
