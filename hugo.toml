baseURL = "https://qref.eknath.dev"
languageCode = "en-us"
title = "QuickRef"
theme = "quickref"

[params]
  description = "A personal collection of developer cheatsheets, commands, and useful references."
  author = "Eknath"
  siteid = "quickref"
  repository = "quickRef"
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github-dark"
    lineNos = false
    tabWidth = 2

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
