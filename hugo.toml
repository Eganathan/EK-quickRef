baseURL = "https://qref.eknath.dev"
languageCode = "en-us"
title = "QuickRef"
theme = "quickref"

[params]
  description = "A personal collection of developer cheatsheets, commands, and useful references."
  author = "Eganathan R (Eknath)"
  siteid = "quickref"
  repository = "quickRef"
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github-dark"
    lineNos = false
    tabWidth = 2

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON", "RECENT"]
  section = ["HTML", "RSS"]

[services.rss]
  limit = -1

[outputFormats.RECENT]
  mediaType = "application/json"
  baseName = "recent"
  isPlainText = true
  notAlternative = true
